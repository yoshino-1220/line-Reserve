<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご予約</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --ink:#1F1D1A;
  --ink-soft:#6E685E;
  --line:#E4E0D8;
  --bg:#FFFFFF;
  --green:#2C4A3B;
  --green-tint:#EDF2EE;
  --gold:#9A7B24;
  --danger:#A32A20;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:15px;
  line-height:1.6;
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* --- ヘッダー --- */
header{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line);
}
.shop{font-size:17px;font-weight:700;letter-spacing:.02em}
.shop span{display:block;font-size:12px;font-weight:400;color:var(--ink-soft);letter-spacing:.08em}
.link{font-size:13px;color:var(--green);text-decoration:underline;text-underline-offset:3px}

section{padding:22px 20px 4px}
h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
h2 .req{color:var(--danger);font-weight:700;margin-left:4px;font-size:11px}
h2 .opt{font-weight:400;margin-left:4px;font-size:11px}

/* --- 日付 --- */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 6px;margin:0 -20px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{
  flex:0 0 auto;width:52px;padding:8px 0 9px;text-align:center;
  border:1px solid var(--line);border-radius:var(--radius);background:#fff;
}
.date b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.date i{display:block;font-size:11px;font-style:normal;color:var(--ink-soft);margin-top:1px}
.date[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.date[aria-pressed="true"] i{color:#CFDCD4}
.date[disabled]{color:#C3BEB4;background:#FAF9F7}
.date[disabled] i{color:#C3BEB4}
.date.sun b{color:var(--danger)}
.date.sat b{color:#2A5B86}
.date[aria-pressed="true"] b{color:#fff}
.date.pn{width:56px;padding:10px 0}
.date.pn b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.month{font-size:12px;color:var(--ink-soft);margin:-4px 0 8px}

/* --- 時間 --- */
.period{margin-bottom:18px}
.period-name{
  display:flex;align-items:center;gap:10px;
  font-size:12px;color:var(--gold);font-weight:700;margin-bottom:8px;
}
.period-name::after{content:"";flex:1;height:1px;background:var(--line)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 4px 8px;text-align:center;background:#fff;
}
.slot b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.slot i{display:block;font-size:10.5px;font-style:normal;color:var(--ink-soft);margin-top:2px}
.slot[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.slot[aria-pressed="true"] i{color:#CFDCD4}
.slot[disabled]{background:#FAF9F7;color:#C3BEB4;border-style:dashed}
.slot[disabled] i{color:#C3BEB4}


/* --- 入力欄 --- */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
input[type=text],input[type=tel],textarea{
  width:100%;padding:11px 12px;font:inherit;font-size:16px;
  border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
}
input:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint)}
input[aria-invalid="true"]{border-color:var(--danger)}
.field-err{font-size:12px;color:var(--danger);margin-top:4px}
textarea{min-height:64px;resize:vertical}

/* --- フッター --- */
.bar{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));
}
.summary{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;min-height:20px}
.submit{
  width:100%;padding:14px;border-radius:var(--radius);
  background:var(--green);color:#fff;font-size:16px;font-weight:700;
}
.submit[disabled]{background:#D6D2CA;color:#fff}

/* --- 状態表示 --- */
.note{padding:28px 20px;color:var(--ink-soft);font-size:14px}
.error{
  margin:16px 20px;padding:12px 14px;border-radius:var(--radius);
  background:#FBEDEB;color:var(--danger);font-size:13.5px;
}
.hidden{display:none}

/* --- 完了 --- */
.done{padding:56px 24px;text-align:center}
.done h1{font-size:20px;margin:0 0 6px;letter-spacing:.04em}
.done p{color:var(--ink-soft);font-size:14px;margin:0 0 28px}
.ticket{
  display:inline-block;text-align:left;border:1px solid var(--green);
  border-radius:var(--radius);padding:18px 26px;margin-bottom:28px;
}
.ticket dt{font-size:11px;color:var(--ink-soft);margin-top:10px}
.ticket dt:first-child{margin-top:0}
.ticket dd{margin:1px 0 0;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* --- 予約一覧 --- */
.item{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 20px 10px}
.item .when{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.item .meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
.cancel{margin-top:10px;font-size:13px;color:var(--danger);text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion:no-preference){
  .slot,.date{transition:background .12s ease,border-color .12s ease}
}
</style>
</head>
<body>

<div id="boot" class="note">読み込んでいます…</div>

<div id="app" class="hidden">
  <header>
    <div class="shop">ポレポレ polepole<span>ご予約</span></div>
    <button class="link" id="toMine">予約を確認</button>
  </header>

  <div id="err" class="error hidden"></div>

  <!-- 予約画面 -->
  <div id="booking">
    <section>
      <h2>人数</h2>
      <div class="dates" id="party"></div>
    </section>

    <section>
      <h2>ご来店日</h2>
      <div class="month" id="month"></div>
      <div class="dates" id="dates"></div>
    </section>

    <section>
      <h2>ご来店時間</h2>
      <div id="times"><p class="note" style="padding:0">日付を選んでください。</p></div>
    </section>

    <section id="infoBox" class="hidden">
      <div class="field">
        <h2><label for="name">お名前</label><span class="req">必須</span></h2>
        <input type="text" id="name" maxlength="50" autocomplete="name" placeholder="例）山田 太郎">
        <div class="field-err hidden" id="nameErr">お名前を入力してください。</div>
      </div>
      <div class="field">
        <h2><label for="phone">電話番号</label><span class="opt">任意</span></h2>
        <input type="tel" id="phone" maxlength="15" autocomplete="tel" inputmode="tel" placeholder="例）090-1234-5678">
        <div class="field-err hidden" id="phoneErr">電話番号は10〜11桁の数字で入力してください。</div>
      </div>
      <div class="field">
        <h2><label for="memo">ご要望</label><span class="opt">任意</span></h2>
        <textarea id="memo" maxlength="200" placeholder="苦手な食材、お席のご希望など"></textarea>
      </div>
    </section>

    <div class="bar">
      <div class="summary" id="summary">人数・日付・時間をお選びください</div>
      <button class="submit" id="submit" disabled>予約を確定する</button>
    </div>
  </div>

  <!-- 完了画面 -->
  <div id="done" class="hidden">
    <div class="done">
      <h1>ご予約を承りました</h1>
      <p>当日のご来店をお待ちしております。</p>
      <dl class="ticket" id="ticket"></dl>
      <div><button class="link" id="toMine2">予約を確認する</button></div>
    </div>
  </div>

  <!-- 予約一覧 -->
  <div id="mine" class="hidden">
    <section><h2>現在のご予約</h2></section>
    <div id="mineList"></div>
    <section><button class="link" id="toBooking">新しく予約する</button></section>
  </div>
</div>

<script>
/* ===== 設定 ===== */
const LIFF_ID = '2011631327-90fBOe5U';
const API = 'https://script.google.com/macros/s/AKfycbzznJauvoBfDcNmoRzWd5ryMEpsVkh3kA2CtmOsfefs1tIPNU6J4Hep14LIv92b9l9I1Q/exec';
const CLOSED_WEEKDAYS = [1, 2];   // 0=日 1=月 2=火
const DAYS_AHEAD = 30;
const MAX_PARTY = 10;             // GAS の CONFIG.MAX_PARTY と合わせる
const DEFAULT_PARTY = 2;

/* ===== 日付ユーティリティ（JST固定） ===== */
const fmtYmd = new Intl.DateTimeFormat('en-CA',
  { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' });
const fmtWd = new Intl.DateTimeFormat('en-US',
  { timeZone: 'Asia/Tokyo', weekday: 'short' });
const WD_NUM = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
const WD_JP = ['日','月','火','水','木','金','土'];

const ymd = d => fmtYmd.format(d);
const wday = d => WD_NUM[fmtWd.format(d)];
const jpDate = key => Number(key.slice(5, 7)) + '月' + Number(key.slice(8)) + '日';

/* ===== 状態 ===== */
let idToken = null;
let slotReq = 0;   // 古い空き状況レスポンスを捨てるための番号
const state = { date:null, start:null, end:null, party:DEFAULT_PARTY, slots:null };

/* ===== DOM ===== */
const $ = id => document.getElementById(id);
const show = (el, on) => el.classList.toggle('hidden', !on);
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function showError(msg) {
  const e = $('err');
  e.textContent = msg;
  show(e, true);
  window.scrollTo({ top: 0 });
}
function clearError() { show($('err'), false); }

/* ===== 前回入力の保存（この端末だけ） ===== */
function loadSaved() {
  try {
    const v = JSON.parse(localStorage.getItem('guest') || '{}');
    if (v.name) $('name').value = v.name;
    if (v.phone) $('phone').value = v.phone;
  } catch (e) {}
}
function saveGuest(name, phone) {
  try { localStorage.setItem('guest', JSON.stringify({ name, phone })); } catch (e) {}
}

/* ===== API ===== */
async function api(action, extra) {
  const body = Object.assign({ action, idToken }, extra || {});
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // プリフライト回避
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('通信に失敗しました（' + res.status + '）');
  return res.json();
}

/* ===== 起動 ===== */
(async function boot() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    if (!idToken) throw new Error('ログイン情報を取得できませんでした。一度アプリを閉じて開き直してください。');

    renderDates();
    renderParty();
    loadSaved();
    updateBar();
    show($('boot'), false);
    show($('app'), true);
  } catch (e) {
    $('boot').textContent = e.message || '起動に失敗しました。';
  }
})();

/* ===== 日付 ===== */
function renderDates() {
  const wrap = $('dates');
  wrap.innerHTML = '';
  const base = new Date();

  for (let i = 0; i < DAYS_AHEAD; i++) {
    const d = new Date(base.getTime() + i * 86400000);
    const key = ymd(d);
    const w = wday(d);
    const closed = CLOSED_WEEKDAYS.indexOf(w) !== -1;

    const b = document.createElement('button');
    b.className = 'date' + (w === 0 ? ' sun' : w === 6 ? ' sat' : '');
    b.type = 'button';
    b.dataset.key = key;
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', jpDate(key) + '（' + WD_JP[w] + '）' + (closed ? ' 定休日' : ''));
    b.disabled = closed;
    b.innerHTML = '<b>' + Number(key.slice(8)) + '</b><i>' +
      (closed ? '定休' : WD_JP[w]) + '</i>';
    b.onclick = () => selectDate(key);
    wrap.appendChild(b);
  }
}

function selectDate(key) {
  clearError();
  document.querySelectorAll('#dates .date').forEach(el =>
    el.setAttribute('aria-pressed', String(el.dataset.key === key)));
  state.date = key;
  $('month').textContent = key.slice(0, 4) + '年' + jpDate(key);
  loadSlots();
}

/* ===== 空き状況（日付＋人数で取得） ===== */
async function loadSlots() {
  if (!state.date) return;
  const keepStart = state.start;
  state.start = null;
  state.end = null;
  show($('infoBox'), false);
  $('times').innerHTML = '<p class="note" style="padding:0">空き状況を確認しています…<br>※取得に時間がかかる場合があります。</p>';
  updateBar();

  const my = ++slotReq;
  try {
    const r = await api('slots', { date: state.date, party: state.party });
    if (my !== slotReq) return;   // 途中で日付・人数が変わった
    if (!r.ok) throw new Error(r.message || '空き状況を取得できませんでした。');
    state.slots = r.data;
    renderTimes(r.data, keepStart);
  } catch (e) {
    if (my !== slotReq) return;
    $('times').innerHTML = '';
    showError(e.message);
  }
}

/* ===== 時間 ===== */
function renderTimes(data, keepStart) {
  const box = $('times');
  box.innerHTML = '';

  if (data.closed) {
    box.innerHTML = '<p class="note" style="padding:0">この日は受付しておりません。</p>';
    return;
  }

  if (!data.slots.some(s => s.available)) {
    box.innerHTML = '<p class="note" style="padding:0 0 12px">この日は' + state.party +
      '名様でご予約いただける時間がございません。人数か日付を変えてお試しください。</p>';
  }

  const groups = {};
  data.slots.forEach(s => { (groups[s.period] = groups[s.period] || []).push(s); });

  Object.keys(groups).forEach(name => {
    const sec = document.createElement('div');
    sec.className = 'period';
    sec.innerHTML = '<div class="period-name">' + esc(name) + '</div>';

    const grid = document.createElement('div');
    grid.className = 'slots';

    groups[name].forEach(s => {
      const b = document.createElement('button');
      b.className = 'slot';
      b.type = 'button';
      b.disabled = !s.available;
      b.setAttribute('aria-pressed', 'false');
      let label;
      if (s.available)          label = '○ 空きあり';
      else if (s.remaining > 0) label = '残り' + s.remaining + '名';
      else                      label = '満席';
      b.innerHTML = '<b>' + s.start + '</b><i>' + label + '</i>';
      b.onclick = () => pickSlot(s, b);
      grid.appendChild(b);
      if (keepStart && s.start === keepStart && s.available) pickSlot(s, b);
    });

    sec.appendChild(grid);
    box.appendChild(sec);
  });
}

function pickSlot(s, b) {
  document.querySelectorAll('.slot').forEach(el => el.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  state.start = s.start;
  state.end = s.end;
  show($('infoBox'), true);
  updateBar();
}

/* ===== 人数 ===== */
function renderParty() {
  const wrap = $('party');
  wrap.innerHTML = '';
  for (let n = 1; n <= MAX_PARTY; n++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'date pn';
    b.innerHTML = '<b>' + n + '名</b>';
    b.setAttribute('aria-pressed', String(n === state.party));
    b.onclick = () => {
      if (state.party === n) return;
      state.party = n;
      wrap.querySelectorAll('button').forEach((el, i) =>
        el.setAttribute('aria-pressed', String(i + 1 === n)));
      if (state.date) loadSlots(); else updateBar();
    };
    wrap.appendChild(b);
  }
}

/* ===== 入力チェック ===== */
const phoneDigits = v => v.replace(/[０-９]/g,
  c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^\d]/g, '');

function validateInfo(showMsg) {
  const name = $('name').value.trim();
  const phoneRaw = $('phone').value.trim();
  const digits = phoneDigits(phoneRaw);
  const nameOk = name.length > 0;
  const phoneOk = !phoneRaw || /^0\d{9,10}$/.test(digits);
  if (showMsg) {
    $('name').setAttribute('aria-invalid', String(!nameOk));
    show($('nameErr'), !nameOk);
    $('phone').setAttribute('aria-invalid', String(!phoneOk));
    show($('phoneErr'), !phoneOk);
  }
  return { ok: nameOk && phoneOk, name, phone: phoneRaw, nameOk, phoneOk };
}

$('name').addEventListener('input', () => { show($('nameErr'), false); $('name').removeAttribute('aria-invalid'); updateBar(); });
$('phone').addEventListener('input', () => { show($('phoneErr'), false); $('phone').removeAttribute('aria-invalid'); updateBar(); });
$('phone').addEventListener('blur', () => { if ($('phone').value.trim()) validateInfo(true); });

/* ===== フッター ===== */
function updateBar() {
  const picked = !!(state.date && state.start);
  const info = validateInfo(false);
  $('submit').disabled = !picked;
  if (!state.date) {
    $('summary').textContent = state.party + '名　日付と時間をお選びください';
  } else if (!state.start) {
    $('summary').textContent = jpDate(state.date) + '　' + state.party + '名　時間をお選びください';
  } else {
    $('summary').textContent = jpDate(state.date) + ' ' + state.start + '〜　' +
      state.party + '名' + (info.nameOk ? '　' + info.name + ' 様' : '　お名前をご入力ください');
  }
}

/* ===== 確定 ===== */
$('submit').onclick = async () => {
  clearError();
  const info = validateInfo(true);
  if (!info.ok) {
    (info.nameOk ? $('phone') : $('name')).focus();
    return;
  }

  const btn = $('submit');
  btn.disabled = true;
  btn.textContent = '送信しています…';

  try {
    const r = await api('reserve', {
      date: state.date,
      start: state.start,
      party: state.party,
      name: info.name,
      phone: info.phone,
      note: $('memo').value.trim(),
    });

    if (!r.ok) {
      showError(r.message || 'この内容では予約できませんでした。');
      if (r.reason === 'FULL') loadSlots();
      return;
    }

    saveGuest(info.name, info.phone);
    $('ticket').innerHTML =
      '<dt>お名前</dt><dd>' + esc(r.name) + ' 様</dd>' +
      '<dt>日時</dt><dd>' + jpDate(r.date) + ' ' + r.start + '〜' + r.end + '</dd>' +
      '<dt>人数</dt><dd>' + r.party + '名</dd>' +
      (r.phone ? '<dt>電話番号</dt><dd>' + esc(r.phone) + '</dd>' : '') +
      '<dt>受付番号</dt><dd>' + esc(r.id) + '</dd>';
    show($('booking'), false);
    show($('done'), true);
    window.scrollTo({ top: 0 });
  } catch (e) {
    showError(e.message);
  } finally {
    btn.textContent = '予約を確定する';
    btn.disabled = !(state.date && state.start);
  }
};

/* ===== 予約一覧 ===== */
async function openMine() {
  clearError();
  show($('booking'), false);
  show($('done'), false);
  show($('mine'), true);
  $('mineList').innerHTML = '<p class="note">読み込んでいます…</p>';

  try {
    const r = await api('mine');
    if (!r.ok) throw new Error('予約を取得できませんでした。');
    if (r.data.length === 0) {
      $('mineList').innerHTML = '<p class="note">現在ご予約はありません。</p>';
      return;
    }
    $('mineList').innerHTML = '';
    r.data.forEach(x => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML =
        '<div class="when">' + jpDate(x.date) + ' ' + x.start + '〜</div>' +
        '<div class="meta">' + (x.name ? esc(x.name) + ' 様　' : '') +
        x.party + '名　受付番号 ' + esc(x.id) + '</div>';
      const c = document.createElement('button');
      c.className = 'cancel';
      c.textContent = 'この予約をキャンセルする';
      c.onclick = async () => {
        if (!confirm(jpDate(x.date) + ' ' + x.start + ' のご予約をキャンセルします。')) return;
        c.disabled = true;
        const res = await api('cancel', { id: x.id });
        if (res.ok) openMine();
        else showError('キャンセルできませんでした。');
      };
      el.appendChild(c);
      $('mineList').appendChild(el);
    });
  } catch (e) {
    $('mineList').innerHTML = '';
    showError(e.message);
  }
}

$('toMine').onclick = openMine;
$('toMine2').onclick = openMine;
$('toBooking').onclick = () => {
  show($('mine'), false);
  show($('done'), false);
  show($('booking'), true);
  slotReq++;
  state.start = null;
  state.end = null;
  state.date = null;
  $('month').textContent = '';
  $('memo').value = '';
  $('times').innerHTML = '<p class="note" style="padding:0">日付を選んでください。</p>';
  document.querySelectorAll('#dates .date').forEach(el => el.setAttribute('aria-pressed', 'false'));
  show($('infoBox'), false);
  updateBar();
};
</script>
</body>
</html>
